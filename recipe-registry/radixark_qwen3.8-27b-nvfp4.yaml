recipe_version: "1"
model: RadixArk/Qwen3.8-27B-NVFP4
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

metadata:
  description: Qwen3.8-27B NVFP4 + DSpark — native NVFP4 format

mods:
  - mods/fix-qwen3-coder-next
  - mods/fix-qwen3.5-chat-template

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 262144 #131072 
  max_num_batched_tokens: 32768 #8192
  load_format: fastsafetensors  # instanttensor may crash dspark drafter loading
  kv_cache_dtype: auto  # bf16; checkpoint nie ma skal q/prob, fp8 KV daje niekalibrowaną uwagę
  attention_backend: flashinfer  # 'fa3' to nazwa z sglang; flash_attn nie ma FP8 KV na SM121 (GB10)
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  speculative_config: '{"method":"dspark", "model": "RadixArk/Qwen3.8-27B-DSpark", "num_speculative_tokens": 7}'
# speculative_config: '{"method":"dspark", "model": "RadixArk/Qwen3.8-27B-DSpark", "num_speculative_tokens": 7, "enable_adaptive_verification": true}'
#speculative_config: '{"method": "DSPARK", "model": "RadixArk/Qwen3.8-27B-DSpark", "block_size": 7, "draft_model_quantization": "unquant"}'

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"  # memory calc may cause crashes

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --served-model-name 'radixark/qwen3.8-27b' \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --chat-template unsloth.jinja \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --enable-prefix-caching \
    --speculative-config '{speculative_config}' \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
